services:
  - type: web
    name: ange-md
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: OWNER_NUMBER
        sync: false
      - key: SESSION_NUMBER
        sync: false
      - key: SESSION_ID
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_API_URL
        value: https://api.openai.com/v1/chat/completions
      - key: AI_MODEL
        value: gpt-4o-mini
      - key: PORT
        value: 3000
